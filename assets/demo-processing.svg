<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e293b"/>
      <stop offset="100%" style="stop-color:#0f172a"/>
    </linearGradient>
    <linearGradient id="ocrGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f59e0b"/>
      <stop offset="100%" style="stop-color:#ef4444"/>
    </linearGradient>
    <linearGradient id="aiGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#8b5cf6"/>
      <stop offset="100%" style="stop-color:#ec4899"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#bgGrad2)"/>

  <!-- Title -->
  <text x="400" y="40" text-anchor="middle" fill="#f1f5f9" font-size="20" font-weight="bold">
    🧠 Processamento com IA
  </text>

  <!-- Document Scanner Animation -->
  <g transform="translate(200, 100)">
    <rect x="0" y="0" width="180" height="220" rx="8" fill="#1e293b" stroke="#475569" stroke-width="2"/>

    <!-- Scanning Line -->
    <line x1="10" y1="0" x2="170" y2="0" stroke="url(#ocrGrad)" stroke-width="3">
      <animate attributeName="y1" from="10" to="210" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="y2" from="10" to="210" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0.5;1" dur="0.2s" repeatCount="indefinite"/>
    </line>

    <!-- Text Lines -->
    <g fill="#94a3b8" font-size="8">
      <rect x="20" y="20" width="140" height="3" fill="#475569"/>
      <rect x="20" y="30" width="120" height="3" fill="#475569"/>
      <rect x="20" y="40" width="130" height="3" fill="#475569"/>
      <rect x="20" y="60" width="140" height="3" fill="#475569"/>
      <rect x="20" y="70" width="120" height="3" fill="#475569"/>
      <rect x="20" y="80" width="130" height="3" fill="#475569"/>
      <rect x="20" y="100" width="140" height="3" fill="#475569"/>
      <rect x="20" y="110" width="120" height="3" fill="#475569"/>
    </g>

    <!-- OCR Badge -->
    <g transform="translate(60, 180)">
      <rect x="0" y="0" width="60" height="24" rx="12" fill="url(#ocrGrad)" opacity="0.2"/>
      <text x="30" y="17" text-anchor="middle" fill="#f59e0b" font-size="11" font-weight="bold">OCR</text>
    </g>
  </g>

  <!-- Process Arrow -->
  <g transform="translate(400, 180)">
    <path d="M0 20 L40 20" stroke="#475569" stroke-width="2" stroke-dasharray="5 3">
      <animate attributeName="stroke-dashoffset" from="0" to="16" dur="0.5s" repeatCount="indefinite"/>
    </path>
    <polygon points="40,15 50,20 40,25" fill="#8b5cf6">
      <animate attributeName="opacity" values="0.5;1;0.5" dur="0.5s" repeatCount="indefinite"/>
    </polygon>
  </g>

  <!-- AI Analysis Panel -->
  <g transform="translate(480, 100)">
    <rect x="0" y="0" width="280" height="220" rx="8" fill="#1e293b" stroke="#475569" stroke-width="2"/>

    <!-- AI Icon Pulsing -->
    <g transform="translate(140, 50)">
      <circle cx="0" cy="0" r="30" fill="url(#aiGrad)" opacity="0.1">
        <animate attributeName="r" values="25;35;25" dur="1.5s" repeatCount="indefinite"/>
      </circle>
      <circle cx="0" cy="0" r="20" fill="url(#aiGrad)" opacity="0.2">
        <animate attributeName="r" values="15;25;15" dur="1.5s" begin="0.2s" repeatCount="indefinite"/>
      </circle>
      <path d="M-8 8 L0 -12 L8 8" fill="none" stroke="url(#aiGrad)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- Analysis Results -->
    <g transform="translate(20, 90)">
      <!-- Sentiment -->
      <g>
        <text x="0" y="0" fill="#94a3b8" font-size="10">Sentimento:</text>
        <text x="80" y="0" fill="#22c55e" font-size="10" font-weight="bold">Positivo</text>
        <rect x="0" y="8" width="100" height="4" rx="2" fill="#334155"/>
        <rect x="0" y="8" width="75" height="4" rx="2" fill="#22c55e"/>
      </g>

      <!-- Entities -->
      <g transform="translate(0, 25)">
        <text x="0" y="0" fill="#94a3b8" font-size="10">Entidades:</text>
        <g font-size="9">
          <text x="0" y="12" fill="#3b82f6">📍 São Paulo</text>
          <text x="90" y="12" fill="#f59e0b">📅 15/01/2024</text>
          <text x="0" y="28" fill="#8b5cf6">👤 João Silva</text>
        </g>
      </g>

      <!-- Summary -->
      <g transform="translate(0, 70)">
        <text x="0" y="0" fill="#94a3b8" font-size="10">Resumo:</text>
        <text x="0" y="15" fill="#e2e8f0" font-size="9" font-style="italic">"Documento aprovado com sucesso..."</text>
      </g>
    </g>

    <!-- Processing Badge -->
    <g transform="translate(200, 200)">
      <circle cx="0" cy="0" r="4" fill="#22c55e">
        <animate attributeName="opacity" values="1;0.3;1" dur="0.3s" repeatCount="indefinite"/>
      </circle>
      <circle cx="8" cy="0" r="4" fill="#22c55e">
        <animate attributeName="opacity" values="0.3;1;0.3" dur="0.3s" repeatCount="indefinite"/>
      </circle>
      <circle cx="16" cy="0" r="4" fill="#22c55e">
        <animate attributeName="opacity" values="1;0.3;1" dur="0.3s" begin="0.1s" repeatCount="indefinite"/>
      </circle>
    </g>
  </g>

  <!-- Status Bar -->
  <g transform="translate(200, 360)">
    <rect x="0" y="0" width="560" height="60" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>

    <!-- Steps -->
    <g transform="translate(30, 30)">
      <!-- Step 1 -->
      <circle cx="0" cy="0" r="12" fill="#22c55e">
        <animate attributeName="r" values="12;14;12" dur="0.5s" repeatCount="indefinite"/>
      </circle>
      <text x="0" y="4" text-anchor="middle" fill="#0f172a" font-size="14">✓</text>
      <text x="0" y="30" text-anchor="middle" fill="#22c55e" font-size="11">Upload</text>
    </g>

    <g transform="translate(130, 30)">
      <circle cx="0" cy="0" r="12" fill="#22c55e"/>
      <text x="0" y="4" text-anchor="middle" fill="#0f172a" font-size="14">✓</text>
      <text x="0" y="30" text-anchor="middle" fill="#22c55e" font-size="11">OCR</text>
    </g>

    <g transform="translate(230, 30)">
      <circle cx="0" cy="0" r="12" fill="url(#aiGrad)">
        <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="1s" repeatCount="indefinite"/>
      </circle>
      <text x="0" y="4" text-anchor="middle" fill="#fff" font-size="10">⟳</text>
      <text x="0" y="30" text-anchor="middle" fill="#8b5cf6" font-size="11">Análise</text>
    </g>

    <g transform="translate(330, 30)">
      <circle cx="0" cy="0" r="12" fill="#475569"/>
      <text x="0" y="4" text-anchor="middle" fill="#94a3b8" font-size="10">4</text>
      <text x="0" y="30" text-anchor="middle" fill="#64748b" font-size="11">Salvar</text>
    </g>

    <g transform="translate(430, 30)">
      <circle cx="0" cy="0" r="12" fill="#475569"/>
      <text x="0" y="4" text-anchor="middle" fill="#94a3b8" font-size="10">5</text>
      <text x="0" y="30" text-anchor="middle" fill="#64748b" font-size="11">Concluir</text>
    </g>

    <!-- Progress Line -->
    <line x1="15" y1="0" x2="205" y2="0" stroke="#22c55e" stroke-width="2"/>
    <line x1="245" y1="0" x2="315" y2="0" stroke="#8b5cf6" stroke-width="2">
      <animate attributeName="x2" values="245;315;245" dur="2s" repeatCount="indefinite"/>
    </line>
  </g>
</svg>
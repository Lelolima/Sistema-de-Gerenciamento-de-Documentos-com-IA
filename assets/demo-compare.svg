<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <defs>
    <linearGradient id="bgGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e293b"/>
      <stop offset="100%" style="stop-color:#0f172a"/>
    </linearGradient>
    <linearGradient id="diffAdd" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#22c55e"/>
      <stop offset="100%" style="stop-color:#16a34a"/>
    </linearGradient>
    <linearGradient id="diffRem" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ef4444"/>
      <stop offset="100%" style="stop-color="#dc2626"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#bgGrad3)"/>

  <!-- Title -->
  <text x="400" y="40" text-anchor="middle" fill="#f1f5f9" font-size="20" font-weight="bold">
    ⚖️ Comparação de Documentos
  </text>

  <!-- Doc A -->
  <g transform="translate(50, 80)">
    <rect x="0" y="0" width="320" height="180" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-width="2"/>
    <rect x="0" y="0" width="320" height="40" rx="8,8,0,0" fill="#3b82f6" opacity="0.2"/>
    <text x="160" y="26" text-anchor="middle" fill="#3b82f6" font-size="14" font-weight="bold">📄 Contrato_v1.pdf</text>

    <!-- Text Content with removed lines -->
    <g font-size="9" font-family="monospace">
      <text x="15" y="60" fill="#64748b">CLÁUSULA PRIMEIRA</text>
      <text x="15" y="75" fill="#e2e8f0">O contratado deverá...</text>
      <rect x="10" y="82" width="300" height="14" fill="url(#diffRem)" opacity="0.3"/>
      <text x="15" y="93" fill="#fca5a5" text-decoration="line-through">Valor: R$ 10.000,00</text>
      <text x="15" y="110" fill="#e2e8f0">Prazo de entrega: 30 dias</text>
      <rect x="10" y="117" width="280" height="14" fill="url(#diffRem)" opacity="0.3"/>
      <text x="15" y="128" fill="#fca5a5" text-decoration="line-through">Pagamento à vista</text>
      <text x="15" y="145" fill="#e2e8f0">Assinatura: ___________</text>
    </g>

    <text x="290" y="170" fill="#ef4444" font-size="11">-2 alterações</text>
  </g>

  <!-- VS Badge -->
  <g transform="translate(385, 170)">
    <circle cx="0" cy="0" r="20" fill="#475569"/>
    <text x="0" y="5" text-anchor="middle" fill="#f1f5f9" font-size="12" font-weight="bold">VS</text>
    <animateTransform attributeName="transform" type="scale" values="1;1.1;1" dur="1s" repeatCount="indefinite"/>
  </g>

  <!-- Doc B -->
  <g transform="translate(430, 80)">
    <rect x="0" y="0" width="320" height="180" rx="8" fill="#1e293b" stroke="#22c55e" stroke-width="2"/>
    <rect x="0" y="0" width="320" height="40" rx="8,8,0,0" fill="#22c55e" opacity="0.2"/>
    <text x="160" y="26" text-anchor="middle" fill="#22c55e" font-size="14" font-weight="bold">📄 Contrato_v2.pdf</text>

    <!-- Text Content with added lines -->
    <g font-size="9" font-family="monospace">
      <text x="15" y="60" fill="#64748b">CLÁUSULA PRIMEIRA</text>
      <text x="15" y="75" fill="#e2e8f0">O contratado deverá...</text>
      <rect x="10" y="82" width="300" height="14" fill="url(#diffAdd)" opacity="0.3"/>
      <text x="15" y="93" fill="#86efac">Valor: R$ 12.000,00</text>
      <text x="15" y="110" fill="#e2e8f0">Prazo de entrega: 30 dias</text>
      <rect x="10" y="117" width="300" height="14" fill="url(#diffAdd)" opacity="0.3"/>
      <text x="15" y="128" fill="#86efac">Pagamento em 2x</text>
      <text x="15" y="145" fill="#e2e8f0">Assinatura: ___________</text>
    </g>

    <text x="290" y="170" fill="#22c55e" font-size="11">+2 alterações</text>
  </g>

  <!-- Similarity Meter -->
  <g transform="translate(250, 290)">
    <rect x="0" y="0" width="300" height="80" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>

    <text x="150" y="25" text-anchor="middle" fill="#94a3b8" font-size="12">Similaridade</text>

    <!-- Gauge -->
    <g transform="translate(150, 55)">
      <!-- Background arc -->
      <path d="M -60 0 A 60 60 0 0 1 60 0" fill="none" stroke="#334155" stroke-width="10" stroke-linecap="round"/>
      <!-- Value arc -->
      <path d="M -60 0 A 60 60 0 0 1 60 0" fill="none" stroke="url(#diffAdd)" stroke-width="10" stroke-linecap="round" stroke-dasharray="188" stroke-dashoffset="47">
        <animate attributeName="stroke-dashoffset" values="188;47;188" dur="3s" repeatCount="indefinite"/>
      </path>
      <text x="0" y="10" text-anchor="middle" fill="#f1f5f9" font-size="18" font-weight="bold">75%</text>
    </g>
  </g>

  <!-- Differences Summary -->
  <g transform="translate(580, 290)">
    <rect x="0" y="0" width="170" height="80" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>

    <text x="85" y="25" text-anchor="middle" fill="#94a3b8" font-size="12">Diferenças</text>

    <g transform="translate(15, 45)">
      <text x="0" y="0" fill="#ef4444" font-size="11">⊖ 2 removidas</text>
      <text x="0" y="20" fill="#22c55e" font-size="11">⊕ 2 adicionadas</text>
    </g>
  </g>

  <!-- Action Buttons -->
  <g transform="translate(250, 400)">
    <rect x="0" y="0" width="120" height="40" rx="8" fill="#3b82f6">
      <animate attributeName="fill" values="#3b82f6;#2563eb;#3b82f6" dur="2s" repeatCount="indefinite"/>
    </rect>
    <text x="60" y="26" text-anchor="middle" fill="#fff" font-size="13" font-weight="bold">Exportar</text>
  </g>

  <g transform="translate(400, 400)">
    <rect x="0" y="0" width="120" height="40" rx="8" fill="#22c55e">
      <animate attributeName="fill" values="#22c55e;#16a34a;#22c55e" dur="2s" begin="0.3s" repeatCount="indefinite"/>
    </rect>
    <text x="60" y="26" text-anchor="middle" fill="#fff" font-size="13" font-weight="bold">Aceitar</text>
  </g>

  <!-- Floating particles -->
  <circle cx="100" cy="450" r="3" fill="#3b82f6" opacity="0.5">
    <animate attributeName="cy" values="450;430;450" dur="1s" repeatCount="indefinite"/>
  </circle>
  <circle cx="700" cy="450" r="3" fill="#22c55e" opacity="0.5">
    <animate attributeName="cy" values="450;430;450" dur="1.2s" repeatCount="indefinite"/>
  </circle>
</svg>
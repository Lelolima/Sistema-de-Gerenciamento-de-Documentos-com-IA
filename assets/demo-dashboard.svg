<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <defs>
    <linearGradient id="bgGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e293b"/>
      <stop offset="100%" style="stop-color:#0f172a"/>
    </linearGradient>
    <linearGradient id="dashGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6"/>
      <stop offset="100%" style="stop-color:#1d4ed8"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#bgGrad4)"/>

  <!-- Sidebar -->
  <rect x="0" y="0" width="180" height="500" fill="#0f172a" stroke="#334155" stroke-width="1"/>

  <!-- Logo -->
  <g transform="translate(20, 20)">
    <rect x="0" y="0" width="32" height="32" rx="8" fill="url(#dashGrad1)"/>
    <path d="M10 22 L16 10 L22 22 Z" fill="#fff" opacity="0.8"/>
    <text x="45" y="22" fill="#f1f5f9" font-size="16" font-weight="bold">DocManager</text>
  </g>

  <!-- Nav Items -->
  <g transform="translate(20, 80)" font-size="13">
    <rect x="0" y="0" width="140" height="36" rx="8" fill="#3b82f6" opacity="0.2"/>
    <text x="35" y="23" fill="#3b82f6" font-weight="bold">📊 Dashboard</text>

    <text x="35" y="68" fill="#64748b">📁 Documentos</text>
    <text x="35" y="103" fill="#64748b">⚖️ Comparar</text>
    <text x="35" y="138" fill="#64748b">🧠 Análises</text>
    <text x="35" y="173" fill="#64748b">⚙️ Config</text>
  </g>

  <!-- Main Content -->
  <g transform="translate(200, 60)">
    <text x="0" y="0" fill="#f1f5f9" font-size="24" font-weight="bold">Dashboard</text>
    <text x="0" y="25" fill="#64748b" font-size="14">Visão geral dos seus documentos</text>
  </g>

  <!-- Stats Cards -->
  <g transform="translate(200, 120)">
    <!-- Card 1 -->
    <rect x="0" y="0" width="130" height="100" rx="12" fill="#1e293b" stroke="#334155"/>
    <text x="15" y="25" fill="#94a3b8" font-size="12">Total Docs</text>
    <text x="15" y="55" fill="#f1f5f9" font-size="28" font-weight="bold">24</text>
    <circle cx="100" cy="25" r="15" fill="#3b82f6" opacity="0.2"/>
    <text x="100" y="30" text-anchor="middle" fill="#3b82f6" font-size="16">📄</text>
    <text x="15" y="85" fill="#22c55e" font-size="11">↑ 12% essa semana</text>

    <!-- Card 2 -->
    <rect x="150" y="0" width="130" height="100" rx="12" fill="#1e293b" stroke="#334155"/>
    <text x="165" y="25" fill="#94a3b8" font-size="12">Processados</text>
    <text x="165" y="55" fill="#f1f5f9" font-size="28" font-weight="bold">18</text>
    <circle cx="250" cy="25" r="15" fill="#8b5cf6" opacity="0.2"/>
    <text x="250" y="30" text-anchor="middle" fill="#8b5cf6" font-size="16">✓</text>
    <text x="165" y="85" fill="#22c55e" font-size="11">↑ 8% essa semana</text>

    <!-- Card 3 -->
    <rect x="300" y="0" width="130" height="100" rx="12" fill="#1e293b" stroke="#334155"/>
    <text x="315" y="25" fill="#94a3b8" font-size="12">Análises</text>
    <text x="315" y="55" fill="#f1f5f9" font-size="28" font-weight="bold">42</text>
    <circle cx="400" cy="25" r="15" fill="#f59e0b" opacity="0.2"/>
    <text x="400" y="30" text-anchor="middle" fill="#f59e0b" font-size="16">🧠</text>
    <text x="315" y="85" fill="#22c55e" font-size="11">↑ 25% essa semana</text>

    <!-- Card 4 -->
    <rect x="450" y="0" width="130" height="100" rx="12" fill="#1e293b" stroke="#334155"/>
    <text x="465" y="25" fill="#94a3b8" font-size="12">Comparados</text>
    <text x="465" y="55" fill="#f1f5f9" font-size="28" font-weight="bold">8</text>
    <circle cx="550" cy="25" r="15" fill="#06b6d4" opacity="0.2"/>
    <text x="550" y="30" text-anchor="middle" fill="#06b6d4" font-size="16">⚖️</text>
    <text x="465" y="85" fill="#22c55e" font-size="11">↑ 3% essa semana</text>
  </g>

  <!-- Chart Area -->
  <g transform="translate(200, 240)">
    <rect x="0" y="0" width="580" height="180" rx="12" fill="#1e293b" stroke="#334155"/>
    <text x="20" y="30" fill="#f1f5f9" font-size="14" font-weight="bold">Atividade Semanal</text>

    <!-- Simple Bar Chart -->
    <g transform="translate(40, 60)">
      <!-- Bars -->
      <rect x="0" y="80" width="50" height="0" fill="#3b82f6" opacity="0.6">
        <animate attributeName="height" values="0;60;60" dur="0.5s" fill="freeze"/>
      </rect>
      <rect x="70" y="80" width="50" height="0" fill="#3b82f6" opacity="0.6">
        <animate attributeName="height" values="0;45;45" dur="0.5s" begin="0.1s" fill="freeze"/>
      </rect>
      <rect x="140" y="80" width="50" height="0" fill="#3b82f6" opacity="0.6">
        <animate attributeName="height" values="0;80;80" dur="0.5s" begin="0.2s" fill="freeze"/>
      </rect>
      <rect x="210" y="80" width="50" height="0" fill="#3b82f6" opacity="0.6">
        <animate attributeName="height" values="0;55;55" dur="0.5s" begin="0.3s" fill="freeze"/>
      </rect>
      <rect x="280" y="80" width="50" height="0" fill="#3b82f6" opacity="0.6">
        <animate attributeName="height" values="0;90;90" dur="0.5s" begin="0.4s" fill="freeze"/>
      </rect>
      <rect x="350" y="80" width="50" height="0" fill="#3b82f6" opacity="0.6">
        <animate attributeName="height" values="0;70;70" dur="0.5s" begin="0.5s" fill="freeze"/>
      </rect>
      <rect x="420" y="80" width="50" height="0" fill="#3b82f6" opacity="0.6">
        <animate attributeName="height" values="0;100;100" dur="0.5s" begin="0.6s" fill="freeze"/>
      </rect>

      <!-- Labels -->
      <text x="25" y="95" text-anchor="middle" fill="#64748b" font-size="10">Seg</text>
      <text x="95" y="95" text-anchor="middle" fill="#64748b" font-size="10">Ter</text>
      <text x="165" y="95" text-anchor="middle" fill="#64748b" font-size="10">Qua</text>
      <text x="235" y="95" text-anchor="middle" fill="#64748b" font-size="10">Qui</text>
      <text x="305" y="95" text-anchor="middle" fill="#64748b" font-size="10">Sex</text>
      <text x="375" y="95" text-anchor="middle" fill="#64748b" font-size="10">Sáb</text>
      <text x="445" y="95" text-anchor="middle" fill="#64748b" font-size="10">Dom</text>
    </g>
  </g>

  <!-- Recent Docs Panel -->
  <g transform="translate(200, 440)">
    <rect x="0" y="0" width="280" height="50" rx="8" fill="#1e293b" stroke="#334155"/>
    <text x="15" y="30" fill="#f1f5f9" font-size="12" font-weight="bold">📁 Recentes</text>
    <g transform="translate(100, 10)" font-size="10">
      <text x="0" y="12" fill="#94a3b8">contrato.pdf</text>
      <text x="80" y="12" fill="#22c55e">✓</text>
      <text x="100" y="12" fill="#94a3b8">nota.docx</text>
      <text x="160" y="12" fill="#22c55e">✓</text>
      <text x="180" y="12" fill="#94a3b8">relatorio.pdf</text>
      <text x="240" y="12" fill="#f59e0b">⟳</text>
    </g>
  </g>

  <!-- User Profile -->
  <g transform="translate(700, 20)">
    <circle cx="0" cy="0" r="20" fill="url(#dashGrad1)"/>
    <text x="0" y="5" text-anchor="middle" fill="#fff" font-size="12">👤</text>
    <text x="0" y="35" text-anchor="middle" fill="#94a3b8" font-size="11">usuario@email.com</text>
  </g>

  <!-- Notification Bell -->
  <g transform="translate(650, 20)">
    <text x="0" y="20" fill="#94a3b8" font-size="20">🔔</text>
    <circle cx="8" cy="-5" r="8" fill="#ef4444">
      <animate attributeName="r" values="6;8;6" dur="0.5s" repeatCount="indefinite"/>
    </circle>
    <text x="8" y="-2" text-anchor="middle" fill="#fff" font-size="8">3</text>
  </g>
</svg>
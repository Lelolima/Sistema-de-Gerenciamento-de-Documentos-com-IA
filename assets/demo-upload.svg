<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <defs>
    <linearGradient id="bgGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e293b"/>
      <stop offset="100%" style="stop-color:#0f172a"/>
    </linearGradient>
    <linearGradient id="accentGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3b82f6"/>
      <stop offset="100%" style="stop-color:#8b5cf6"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#bgGrad1)"/>

  <!-- Title -->
  <text x="400" y="40" text-anchor="middle" fill="#f1f5f9" font-size="20" font-weight="bold">
    📤 Upload de Documentos
  </text>

  <!-- Drop Zone -->
  <g>
    <rect x="200" y="100" width="400" height="200" rx="16" fill="none" stroke="#3b82f6" stroke-width="3" stroke-dasharray="10 5">
      <animate attributeName="stroke-dashoffset" from="0" to="100" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;1;0.6" dur="2s" repeatCount="indefinite"/>
    </rect>

    <!-- Upload Icon -->
    <g transform="translate(375, 175)">
      <path d="M0 40 L0 -20 M-25 5 L0 -20 L25 5" stroke="url(#accentGrad1)" stroke-width="4" fill="none" stroke-linecap="round">
        <animateTransform attributeName="transform" type="translate" values="0,0; 0,-10; 0,0" dur="1.5s" repeatCount="indefinite"/>
      </path>
      <path d="M-30 40 L30 40" stroke="#3b82f6" stroke-width="4" stroke-linecap="round"/>
    </g>

    <text x="400" y="240" text-anchor="middle" fill="#94a3b8" font-size="14">
      Arraste e solte arquivos aqui
    </text>
  </g>

  <!-- File Icons Animation -->
  <g>
    <!-- File 1 -->
    <g transform="translate(150, 350)">
      <rect x="0" y="0" width="50" height="60" rx="4" fill="#3b82f6" opacity="0.2"/>
      <rect x="0" y="0" width="50" height="60" rx="4" fill="none" stroke="#3b82f6" stroke-width="2"/>
      <path d="M30 0 L50 20 L50 60 L0 60 L0 20 Z" fill="#3b82f6" opacity="0.3"/>
      <text x="25" y="35" text-anchor="middle" fill="#3b82f6" font-size="10" font-weight="bold">PDF</text>
      <circle cx="25" cy="50" r="8" fill="#22c55e">
        <animate attributeName="r" values="0;8;0" dur="1s" begin="0.5s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- File 2 -->
    <g transform="translate(220, 350)">
      <rect x="0" y="0" width="50" height="60" rx="4" fill="#8b5cf6" opacity="0.2"/>
      <rect x="0" y="0" width="50" height="60" rx="4" fill="none" stroke="#8b5cf6" stroke-width="2"/>
      <path d="M30 0 L50 20 L50 60 L0 60 L0 20 Z" fill="#8b5cf6" opacity="0.3"/>
      <text x="25" y="35" text-anchor="middle" fill="#8b5cf6" font-size="10" font-weight="bold">DOC</text>
      <circle cx="25" cy="50" r="8" fill="#22c55e">
        <animate attributeName="r" values="0;8;0" dur="1s" begin="1s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- File 3 -->
    <g transform="translate(290, 350)">
      <rect x="0" y="0" width="50" height="60" rx="4" fill="#06b6d4" opacity="0.2"/>
      <rect x="0" y="0" width="50" height="60" rx="4" fill="none" stroke="#06b6d4" stroke-width="2"/>
      <path d="M30 0 L50 20 L50 60 L0 60 L0 20 Z" fill="#06b6d4" opacity="0.3"/>
      <text x="25" y="35" text-anchor="middle" fill="#06b6d4" font-size="10" font-weight="bold">IMG</text>
      <circle cx="25" cy="50" r="8" fill="#22c55e">
        <animate attributeName="r" values="0;8;0" dur="1s" begin="1.5s" repeatCount="indefinite"/>
      </circle>
    </g>
  </g>

  <!-- Progress Bar -->
  <g transform="translate(550, 350)">
    <rect x="0" y="0" width="150" height="8" rx="4" fill="#334155"/>
    <rect x="2" y="2" width="146" height="4" rx="2" fill="url(#accentGrad1)">
      <animate attributeName="width" values="0;146;0" dur="3s" repeatCount="indefinite"/>
    </rect>
    <text x="75" y="25" text-anchor="middle" fill="#94a3b8" font-size="12">Enviando...</text>
  </g>

  <!-- Status Badge -->
  <g transform="translate(600, 420)">
    <rect x="0" y="-20" width="100" height="40" rx="20" fill="#22c55e" opacity="0.2">
      <animate attributeName="opacity" values="0.1;0.3;0.1" dur="2s" repeatCount="indefinite"/>
    </rect>
    <text x="50" y="5" text-anchor="middle" fill="#22c55e" font-size="14" font-weight="bold">✓ Sucesso</text>
  </g>
</svg>